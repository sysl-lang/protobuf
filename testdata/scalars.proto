// The encoding oracle's messages: every scalar type, every repeated shape, a oneof whose members are
// not consecutive, maps, enums with negative values and aliases, and names sysl reserves.
syntax = "proto3";

package sh.sysl.protobuf.testdata;

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
  COLOR_BLUE = -3;
}

message Repeats {
  repeated int32 packed_int32 = 1;
  repeated sint64 packed_sint64 = 2;
  repeated double packed_double = 3;
  repeated fixed32 packed_fixed32 = 4;
  repeated bool packed_bool = 5;
  repeated int32 unpacked_int32 = 6 [packed = false];
  repeated string strings = 7;
  repeated bytes blobs = 8;
  repeated Color colors = 9;
  repeated Scalars nested = 10;
  repeated uint64 packed_uint64 = 11;
  repeated float packed_float = 12;
  repeated sfixed64 packed_sfixed64 = 13;
}

message Shapes {
  message Point {
    sint32 x = 1;
    sint32 y = 2;
  }

  enum Status {
    option allow_alias = true;
    STATUS_UNKNOWN = 0;
    STATUS_STARTED = 1;
    STATUS_RUNNING = 1;
    STATUS_DONE = 2;
  }

  Point origin = 1;
  oneof shape {
    double radius = 2;
    Point corner = 4;
    string label = 5;
    Color fill = 13;
  }
  int32 between = 3;
  optional int32 maybe = 6;
  map<string, int32> counts = 8;
  map<int32, Point> points = 9;
  Color color = 10;
  optional Color maybe_color = 11;
  Status status = 12;
  reserved 20 to 25;
  reserved "old";
}

// Names sysl reserves, and names every message already has.
message Keywords {
  string type = 1;
  int32 match = 2;
  bool encode = 3;
  repeated string val = 4;
}

message Nothing {}
